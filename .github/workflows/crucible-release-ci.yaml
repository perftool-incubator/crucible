name: crucible-release-ci

on:
  workflow_call:
    secrets:
      PRIVATE_KEY__TAG_CRUCIBLE_RELEASE:
        required: true
  workflow_dispatch:

concurrency:
  group: crucible-release-ci-global-queue
  cancel-in-progress: false
  queue: max

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      only-docs: ${{ steps.filter.outputs.only_modified }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        uses: tj-actions/changed-files@v47
        with:
          files: |
            LICENSE
            *.md
            **/*.md
            .github/rulesets/**
            .github/workflows/run-crucible-tracking.yaml
            .github/workflows/crucible-weekly-ci.yaml
            .github/workflows/crucible-scheduled.yaml
            .github/workflows/crucible-release-schedule.yaml
            .github/workflows/crucible-release-ci.yaml
            .github/workflows/crucible-ci.yaml
            .github/workflows/ci.yaml
            .github/workflows/controller-build.yaml
            .github/workflows/build-publish-controller.yaml
            .github/workflows/build-publish-controller-worker.yaml
            .github/workflows/fork-check.yaml
            .gitignore
            .claude/**
            .agents/**
            docs/**
            spec/**
      - name: Display changes
        run: echo '${{ toJSON(steps.filter.outputs) }}' | jq .

  call-crucible-release-remove:
    needs: changes
    if: ${{ github.event.pull_request.head.repo.fork != true && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.only-docs != 'true') }}
    uses: ./.github/workflows/crucible-release.yaml
    with:
      custom_release: "ci-version-test"
      action: "delete"
      force_create: true
    secrets:
      PRIVATE_KEY__TAG_CRUCIBLE_RELEASE: ${{ secrets.PRIVATE_KEY__TAG_CRUCIBLE_RELEASE }}

  call-crucible-release-create:
    needs: call-crucible-release-remove
    if: ${{ github.event.pull_request.head.repo.fork != true && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.only-docs != 'true') }}
    uses: ./.github/workflows/crucible-release.yaml
    with:
      custom_release: "ci-version-test"
      action: "create"
    secrets:
      PRIVATE_KEY__TAG_CRUCIBLE_RELEASE: ${{ secrets.PRIVATE_KEY__TAG_CRUCIBLE_RELEASE }}

  call-crucible-release-update:
    needs: call-crucible-release-create
    if: ${{ github.event.pull_request.head.repo.fork != true && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.only-docs != 'true') }}
    uses: ./.github/workflows/crucible-release.yaml
    with:
      custom_release: "ci-version-test"
      action: "update"
    secrets:
      PRIVATE_KEY__TAG_CRUCIBLE_RELEASE: ${{ secrets.PRIVATE_KEY__TAG_CRUCIBLE_RELEASE }}

  faux-crucible-release-ci:
    needs: changes
    if: ${{ github.event.pull_request.head.repo.fork != true && github.event_name != 'workflow_dispatch' && needs.changes.outputs.only-docs == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "faux-crucible-release-ci-complete"

  crucible-release-ci-complete:
    needs:
      - changes
      - call-crucible-release-remove
      - call-crucible-release-create
      - call-crucible-release-update
      - faux-crucible-release-ci
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify expected release CI route succeeded
        env:
          EVENT_NAME: ${{ github.event_name }}
          ONLY_DOCS: ${{ needs.changes.outputs.only-docs }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          REMOVE_RESULT: ${{ needs.call-crucible-release-remove.result }}
          CREATE_RESULT: ${{ needs.call-crucible-release-create.result }}
          UPDATE_RESULT: ${{ needs.call-crucible-release-update.result }}
          FAUX_RESULT: ${{ needs.faux-crucible-release-ci.result }}
        run: |
          set -euo pipefail

          if [ "$CHANGES_RESULT" != "success" ]; then
              echo "Change detection did not succeed: $CHANGES_RESULT"
              exit 1
          fi

          if [ "$EVENT_NAME" != "workflow_dispatch" ] && [ "$ONLY_DOCS" = "true" ]; then
              if [ "$FAUX_RESULT" != "success" ]; then
                  echo "Docs-only route did not succeed: $FAUX_RESULT"
                  exit 1
              fi
              if [ "$REMOVE_RESULT" != "skipped" ] || \
                  [ "$CREATE_RESULT" != "skipped" ] || \
                  [ "$UPDATE_RESULT" != "skipped" ]; then
                  echo "Release phases unexpectedly ran for a docs-only change"
                  exit 1
              fi
          else
              if [ "$REMOVE_RESULT" != "success" ] || \
                  [ "$CREATE_RESULT" != "success" ] || \
                  [ "$UPDATE_RESULT" != "success" ]; then
                  echo "Release phase results were remove=$REMOVE_RESULT create=$CREATE_RESULT update=$UPDATE_RESULT"
                  exit 1
              fi
              if [ "$FAUX_RESULT" != "skipped" ]; then
                  echo "Docs-only route unexpectedly ran: $FAUX_RESULT"
                  exit 1
              fi
          fi

          echo "crucible-release-ci-complete"
